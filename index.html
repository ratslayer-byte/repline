<title>Clean Reps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500&display=swap">
<style>/* One dark ground, no containers; glass only over the camera. Type: 88 / 28 / 17 / 13 */
:root{
  --bg:#0a0a0b; --fg:#f5f5f7; --mut:#8e8e93; --hair:rgba(255,255,255,.1);
  --lime:#d4ff5c; --lime-soft:rgba(212,255,92,.38); --red:#ff453a; --empty:rgba(255,255,255,.14);
  --font:Geist,-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body,#root{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0}
button{cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--lime);outline-offset:3px}
.tn{font-variant-numeric:tabular-nums}
.t88{font-size:88px;line-height:88px;font-weight:300;letter-spacing:-.05em}
.t28{font-size:28px;line-height:32px;font-weight:400;letter-spacing:-.02em}
.t17{font-size:17px;line-height:23px;font-weight:400;letter-spacing:-.01em}
.t13{font-size:13px;line-height:17px;font-weight:400}
.w5{font-weight:500}
.mut{color:var(--mut)}
.glass{background:rgba(30,30,32,.45);-webkit-backdrop-filter:blur(28px) saturate(170%);backdrop-filter:blur(28px) saturate(170%);box-shadow:inset 0 .5px 0 rgba(255,255,255,.28),inset 0 0 0 .5px rgba(255,255,255,.1)}

.screen{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 14px) 24px calc(env(safe-area-inset-bottom,0px) + 16px);overflow-y:auto;-webkit-overflow-scrolling:touch;z-index:10}
.bar{display:flex;justify-content:space-between;align-items:center;min-height:44px}
.icoBtn{width:44px;height:44px;border-radius:22px;display:grid;place-items:center;color:var(--fg)}
.icoBtn svg{width:20px;height:20px}
.icoBtn.fill{background:rgba(255,255,255,.08)}
.spacer{flex:1;min-height:20px}
.cta{height:60px;border-radius:30px;background:var(--lime);color:#0a0a0b;font-size:17px;font-weight:500;letter-spacing:-.01em;width:100%;flex:none;display:grid;place-items:center}
.cta.white{background:var(--fg)}
.demoPill{height:32px;padding:0 14px;border-radius:16px;background:var(--fg);color:#0a0a0b;font-size:13px;font-weight:500;margin-right:6px;display:grid;place-items:center}
.chip{margin-top:22px;height:40px;padding:0 16px 0 6px;border-radius:20px;background:rgba(255,255,255,.08);display:inline-flex;align-items:center;gap:10px;font-size:13px;font-weight:500;align-self:flex-start}
.chip .play{width:28px;height:28px;border-radius:14px;background:var(--lime);display:grid;place-items:center}

.week{margin-top:34px;display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
.wk{display:flex;flex-direction:column;align-items:center;gap:10px}
.wk .stack{height:64px;width:12px;display:flex;flex-direction:column-reverse;align-items:center}
.wk .stack b{display:block;width:12px;flex:none}

.modeSw{position:relative;display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:28px;background:rgba(255,255,255,.06);height:64px;flex:none}
.modeSw button{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;font-size:17px;font-weight:500;color:var(--mut);transition:color .3s;border-radius:24px}
.modeSw button[aria-checked="true"]{color:var(--fg)}
.modeSw .thumb{position:absolute;inset:0;border-radius:24px;background:rgba(255,255,255,.12);box-shadow:inset 0 .5px 0 rgba(255,255,255,.25);z-index:0}
.modeSw .lbl{position:relative;z-index:1;display:flex;align-items:center;gap:10px}
.modeSw svg{width:24px;height:24px;overflow:visible}
.face .bg{transition:fill .35s ease,stroke .35s ease}
.face .ink{transition:fill .35s ease}
.face .brow{fill:none;stroke-width:1.5;stroke-linecap:round;transition:stroke .35s ease}
.face .mouth{transform-box:fill-box;transform-origin:50% 0}
#modeCap{margin:12px 4px 0;min-height:17px}

.stepRow{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;flex:none}
.stepBtn{width:48px;height:48px;border-radius:24px;border:1px solid rgba(255,255,255,.14);display:grid;place-items:center}
.stepBtn svg{width:14px;height:14px}
.repChip{display:flex;align-items:baseline;gap:8px;padding:8px 16px;border-radius:18px;background:rgba(255,255,255,.06)}

/* dial */
.dialShade{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.35);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.dialSheet{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);border-radius:43px;padding:10px 0 20px;display:flex;flex-direction:column;align-items:center;z-index:41;background:rgba(36,36,38,.92)}
.grab{width:36px;height:5px;border-radius:3px;background:rgba(255,255,255,.25)}
.dialNum{margin-top:26px;display:flex;align-items:baseline;justify-content:center;gap:8px}
.dialIn{text-align:center;background:transparent;outline:none;caret-color:var(--lime);-webkit-user-select:text;user-select:text}
.dialCv{margin-top:26px;width:100%;height:92px;display:block;touch-action:none;cursor:grab;-webkit-mask-image:linear-gradient(90deg,transparent,#000 28%,#000 72%,transparent);mask-image:linear-gradient(90deg,transparent,#000 28%,#000 72%,transparent)}

/* stage */
.stage{position:fixed;inset:0;background:#2b2d2d;overflow:hidden;z-index:5}
.stage video,.stage canvas.ov{position:absolute;inset:0;width:100%;height:100%}
.stage video{object-fit:cover;opacity:0;transition:opacity .8s ease}
.stage video.on{opacity:1}
.stage video.mirror{transform:scaleX(-1)}
.hudTop{position:absolute;left:16px;right:16px;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;justify-content:space-between;align-items:center;z-index:5}
.pill{height:36px;padding:0 14px;border-radius:18px;display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:500}
.pill i{width:8px;height:8px;border-radius:4px;background:var(--lime)}
.countBlk{position:absolute;left:24px;right:24px;top:calc(env(safe-area-inset-top,0px) + 70px);z-index:4;text-shadow:0 1px 14px rgba(0,0,0,.25)}
.countOf{color:rgba(245,245,247,.55)}
.liveLine{color:rgba(245,245,247,.75);margin-top:4px}
.liveLine b{font-weight:400}
.liveLine b.bad{color:var(--red)}
.banner{position:absolute;left:0;right:0;margin:0 auto;width:max-content;max-width:calc(100% - 48px);top:calc(env(safe-area-inset-top,0px) + 222px);padding:11px 18px;border-radius:22px;background:var(--red);color:#fff;font-size:17px;font-weight:500;z-index:6;text-align:center}
.banner.good{background:var(--lime);color:#0a0a0b}
.banner.info{background:rgba(30,30,32,.75);-webkit-backdrop-filter:blur(28px);backdrop-filter:blur(28px);font-size:13px;line-height:17px;max-width:320px}
.card{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);border-radius:43px;padding:24px;z-index:7}
.card h3{margin:0;font-size:28px;line-height:32px;font-weight:400;letter-spacing:-.02em}
.checks{display:grid;gap:12px;margin-top:16px}
.chk{display:flex;align-items:center;gap:12px;font-size:17px;color:rgba(245,245,247,.55);transition:color .25s}
.chk i{width:22px;height:22px;border-radius:11px;border:1.5px solid rgba(255,255,255,.3);display:grid;place-items:center;flex:none;transition:all .3s cubic-bezier(.32,.72,0,1)}
.chk.on{color:var(--fg)}
.chk.on i{background:var(--lime);border-color:var(--lime)}
.chk.on i::after{content:"";width:5px;height:9px;border:solid #0a0a0b;border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.cardRow{display:flex;justify-content:space-between;align-items:center;margin-top:18px}
.linkBtn{font-size:13px;font-weight:500;color:var(--lime);padding:8px 0 8px 12px;white-space:nowrap;flex:none}
.cardBtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.btn2{height:52px;border-radius:26px;background:rgba(255,255,255,.12);font-size:17px;font-weight:500}
.btn2.red{background:var(--red);color:#fff}
.countdown{position:absolute;inset:0;display:grid;place-items:center;z-index:6;pointer-events:none;color:var(--lime);text-shadow:0 0 40px rgba(212,255,92,.5)}
.panel{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);border-radius:43px;padding:20px;z-index:5}
.pHead{display:flex;justify-content:space-between;align-items:baseline}
.panel canvas{display:block;width:100%;height:96px;margin-top:10px}
.dots{margin-top:16px;display:flex}
.dots i{width:10px;height:10px;border-radius:5px;background:var(--empty);flex:none}
.surface{position:fixed;inset:0;background:var(--lime);z-index:60;pointer-events:none}

/* done + calendar */
.dots5{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}
.dots5 i{width:14px;height:14px;border-radius:7px;flex:none}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--hair);padding-top:18px;margin-top:36px}
.stats3>div{display:flex;flex-direction:column;gap:4px}
.stats3>div+div{padding-left:16px;border-left:1px solid var(--hair)}
.calGrid{display:grid;grid-template-columns:repeat(7,1fr);row-gap:4px;justify-items:center;margin-top:26px}
.calGrid .dow{padding-bottom:6px}
.day{width:44px;height:44px;position:relative;display:grid;place-items:center;border-radius:22px}
.day svg{position:absolute;left:2px;top:2px}
.day span{position:relative;font-size:17px}
.day.sel{background:rgba(255,255,255,.08)}
.setRow{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-top:1px solid var(--hair)}
.setRow .d{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px;max-width:250px}
.setRow .d i{width:8px;height:8px;border-radius:4px}
.err{margin-top:14px;padding:12px 14px;border-radius:16px;background:rgba(255,69,58,.14);font-size:13px;line-height:17px}
.calSurface{position:fixed;inset:0;background:var(--bg);z-index:20}

@media (orientation:landscape) and (max-height:520px){
  .t88{font-size:64px;line-height:64px}
  .panel,.card{left:auto;width:min(400px,48vw);right:max(12px,env(safe-area-inset-right,0px))}
  .panel canvas{height:60px}
}
</style>
</head>
